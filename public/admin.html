<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MARGA – Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b1f2b">
  <link rel="icon" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body>
<header id="nav"></header>
<main class="wrap" style="padding-top:28px;padding-bottom:60px">
  <h1>Admin console</h1><p class="muted">Verify parking facilities before they are shown to drivers.</p>
  <div class="grid3 mt" id="stats" style="grid-template-columns:repeat(6,1fr)"></div>
  <div class="row between wrap-sm mt2"><h2>Facilities</h2>
    <select id="flt" style="width:180px"><option value="pending">Pending review</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="">All</option></select></div>
  <div id="list" class="mt"></div>
  <h2 class="mt2">Driver reports</h2><p class="muted">All reports from drivers. Operators resolve them for their own facilities; you can step in on any.</p>
  <div id="dpList" class="mt"></div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
  if (requireRole('admin')) init();
  let items = [];
  async function init() {
    renderNav(); $('flt').onchange = load; load(); stats(); loadDisputes();
  }
  async function stats() {
    const s = await api('/admin/stats').catch(() => null); if (!s) return;
    $('stats').innerHTML = [['drivers', 'Drivers'], ['operators', 'Operators'], ['facilities', 'Facilities'], ['pending', 'Pending'], ['bookings', 'Bookings'], ['revenue', 'Revenue']]
      .map(([k, l]) => `<div class="stat"><b style="font-size:1.4rem">${k === 'revenue' ? inr(s[k]) : s[k]}</b><span>${l}</span></div>`).join('');
  }
  async function load() {
    try { items = await api('/admin/facilities' + ($('flt').value ? '?status=' + $('flt').value : '')); } catch (e) { return toast(e.message, 'err'); }
    $('list').innerHTML = items.length ? items.map((f) => `<div class="card" style="margin-bottom:14px">
      <div class="row between wrap-sm"><div><h3>${esc(f.name)}</h3><p class="muted">${esc(f.address)} · ${esc(f.kind.replace('_', ' '))}</p></div>${badge(f.verification_status)}</div>
      <div class="kv"><span>Operator</span><b>${esc(f.owner_name)} (${esc(f.owner_email)})</b><span>Location</span><b>${f.lat}, ${f.lng} · <a target="_blank" href="https://www.openstreetmap.org/?mlat=${f.lat}&mlon=${f.lng}#map=18/${f.lat}/${f.lng}">view map</a></b>
      <span>Rate</span><b>${inr(f.hourly_rate)}/hr</b><span>Layout</span><b>${esc(f.layout_status)} · ${f.slot_count} slots</b>
      <span>Ownership / authority</span><b>${esc(f.authority_note)}</b>${f.review_note ? `<span>Review note</span><b>${esc(f.review_note)}</b>` : ''}</div>
      <div class="row gap mt">
        ${f.verification_status !== 'approved' ? `<button class="btn sm" data-a="approved" data-id="${f.id}">Approve</button>` : ''}
        ${f.verification_status !== 'rejected' ? `<button class="btn danger sm" data-a="rejected" data-id="${f.id}">Reject</button>` : ''}
      </div></div>`).join('') : '<div class="card"><p class="muted">Nothing here.</p></div>';
  }
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const note = prompt(b.dataset.a === 'approved' ? 'Optional note for the operator:' : 'Reason for rejection:');
    if (note === null) return;
    try { await api(`/admin/facilities/${b.dataset.id}/review`, { method: 'POST', body: { status: b.dataset.a, note } }); toast('Updated'); load(); stats(); }
    catch (err) { toast(err.message, 'err'); }
  });

  const DP_CAT = { overcharged: 'Overcharged', slot_taken: 'Slot taken by someone else', wrong_slot: 'Wrong slot / directions', facility_closed: 'Facility closed', refund_not_received: 'Refund not received', other: 'Other' };
  async function loadDisputes() {
    try {
      const l = await api('/disputes/all');
      $('dpList').innerHTML = l.length ? l.map((d) => `<div class="card" style="margin-bottom:14px"><div class="row between wrap-sm"><div><h3>${esc(DP_CAT[d.category] || d.category)}</h3><p class="muted">${esc(d.facility_name)} · ${esc(d.user_name)} · ${esc(d.ref)} · ${fmt(d.created_at)}</p></div><span class="badge ${d.status === 'open' ? 'b-warn' : d.status === 'refunded' ? 'b-ok' : 'b-err'}">${d.status}</span></div>
        <p>${esc(d.description)}</p>${d.resolution_note ? `<div class="info-box">${esc(d.resolution_note)}${d.refund_amount ? ` · refunded ${inr(d.refund_amount)}` : ''}</div>` : `<div class="row gap mt"><button class="btn sm" data-a="refund" data-id="${d.id}">Refund…</button><button class="btn ghost sm" data-a="reject" data-id="${d.id}">Reject</button></div>`}</div>`).join('')
        : '<div class="card"><p class="muted">No reports yet.</p></div>';
    } catch (e) { toast(e.message, 'err'); }
  }
  $('dpList').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-a]'); if (!btn) return;
    const body = { action: btn.dataset.a };
    if (btn.dataset.a === 'refund') { const a = prompt('Refund amount in ₹ (leave empty to refund everything the driver paid):', ''); if (a === null) return; body.amount = a.trim() === '' ? 'full' : a; }
    const note = prompt('Note for the driver:', ''); if (!note) return; body.note = note;
    try { await api(`/disputes/${btn.dataset.id}/resolve`, { method: 'POST', body }); toast('Report resolved'); loadDisputes(); } catch (err) { toast(err.message, 'err'); }
  });
</script>
</body>
</html>
